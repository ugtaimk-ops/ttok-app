<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>똑 화면별 UI 편집기</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#17243a;background:#f3f6fb}
    *{box-sizing:border-box}body{margin:0;padding:24px;max-width:1280px;margin-inline:auto}
    h1{margin:0 0 8px;font-size:27px}h2{margin:0 0 8px}.muted{color:#627189;line-height:1.55}
    button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #cbd8e8;background:white;border-radius:10px;padding:9px 12px;color:#17345b}
    button:hover{border-color:#1970e9}button.primary{background:#1267db;color:white;border-color:#1267db}
    .tip{background:#e8f2ff;border:1px solid #c9e0ff;padding:12px 15px;border-radius:12px}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;align-items:start}
    .card{background:white;border:1px solid #dce5ef;border-radius:16px;padding:16px;box-shadow:0 4px 20px #17345b0b}
    .screens{position:sticky;top:12px;max-height:78vh;overflow:auto}.screens button{display:block;width:100%;text-align:left;margin:3px 0;border:0}
    .screens button.active{background:#e9f2ff;color:#0863cf;font-weight:700}.count{float:right;color:#718096}
    .filters{display:flex;gap:8px;align-items:center;margin:14px 0}.filters input{flex:1;min-width:120px;padding:10px;border:1px solid #cbd8e8;border-radius:10px}
    .row{display:flex;gap:12px;align-items:center;border-top:1px solid #edf1f6;padding:12px 0}.row:first-child{border:0}
    .number{font-weight:800;color:#1267db;min-width:150px;font-size:12px;overflow-wrap:anywhere}.info{flex:1;min-width:150px}
    .label{font-weight:700}.meta{font-size:13px;color:#65758a;margin-top:3px;word-break:break-word}.source{font-size:11px;color:#8593a7;margin-top:3px}
    .actions{display:flex;gap:5px;flex-wrap:wrap}.actions button{padding:6px 8px;font-size:13px}.hidden-item{opacity:.45}
    .editor{margin-top:18px;padding:16px;border-radius:14px;background:#f3f7fc}.editor label{display:block;font-weight:700;margin:10px 0 5px}
    .editor input,.editor textarea,.editor select{width:100%;border:1px solid #cbd8e8;border-radius:9px;padding:10px;background:white}
    .editor textarea{min-height:66px;resize:vertical}.editor .buttons{display:flex;gap:8px;margin-top:14px}
    .empty{padding:26px 6px;color:#627189;text-align:center}.badge{display:inline-block;margin-left:7px;border-radius:20px;background:#edf3fb;color:#53657d;padding:3px 8px;font-size:12px}
    @media(max-width:760px){body{padding:12px}.layout{display:block}.screens{position:static;max-height:220px;margin-bottom:12px}.row{align-items:flex-start;flex-wrap:wrap}.info{min-width:calc(100% - 165px)}.actions{margin-left:0;width:100%}.number{max-width:150px}}
  </style>
</head>
<body>
  <h1>똑 화면별 UI 편집기</h1>
  <p class="muted">왼쪽에서 화면을 고르면 해당 화면에 실제로 연결된 버튼과 선택 요소만 나옵니다. 이름표 ID와 코드 위치도 함께 표시합니다. 변경은 설계안으로 저장되며, 실제 앱 반영은 별도 코드 수정이 필요합니다.</p>
  <p class="tip">요소를 숨기거나 이름·기능 메모를 적고 순서를 정한 뒤 <b>변경안 JSON 저장</b>을 누르세요. 새 버튼은 추가 요청으로 기록됩니다.</p>
  <div class="toolbar">
    <button class="primary" id="save">변경안 JSON 저장</button>
    <button id="add">현재 화면에 버튼 추가 요청</button>
    <button id="reset">이 화면 편집 초기화</button>
  </div>
  <div class="layout">
    <nav class="screens card" id="screens" aria-label="화면 목록"></nav>
    <main class="card">
      <h2 id="screenTitle"></h2>
      <p class="muted" id="screenDescription"></p>
      <div class="filters"><input id="search" type="search" placeholder="이 화면에서 버튼 찾기" aria-label="버튼 검색"><label><input id="showHidden" type="checkbox"> 숨긴 항목도 보기</label></div>
      <div id="items"></div>
      <section class="editor" id="editor" hidden>
        <h3 id="editorTitle">항목 편집</h3>
        <label for="itemLabel">표시 이름 / 원하는 이름</label><input id="itemLabel">
        <label for="itemAction">현재 기능 / 원하는 기능</label><textarea id="itemAction"></textarea>
        <label for="itemScreen">화면</label><select id="itemScreen"></select>
        <label for="itemNote">요청 내용 (예: 제거, 크기 축소, 오른쪽으로 이동)</label><textarea id="itemNote"></textarea>
        <div class="buttons"><button class="primary" id="apply">저장</button><button id="cancel">취소</button></div>
      </section>
    </main>
  </div>
  <script>
    const storageKey="ttok-ui-review-v2";
    const $=id=>document.getElementById(id);
    const escape=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    let catalog=[], items=[], screens=[], activeScreen="", editingId=null;
    function persist(){try{localStorage.setItem(storageKey,JSON.stringify(items));}catch{}}
    function setupScreens(){
      const names=[...new Set(catalog.map(x=>x.screen))];
      const preferred=["로그인","이메일 인증","첫 이용 약관","홈 · AI 리포트","홈 · 바로가기 편집","홈 · 일정 추가·수정","홈 · 일정 카드","수행평가 · 일정 목록","수행평가 · 직접 입력","수행평가 · 사진 등록·결과","수행평가 · 수정·삭제 팝업","발표 · 대본 작성","발표 · 연습 준비","발표 · 연습 진행","발표 · 프롬프터","발표 · 분석 결과","발표 · 저장 대본 보기","발표 · 권한 안내","공부 · AI 공부 도우미","공부 · 사진 문제 풀이","공부 · 시험 계획","프로필 · 정보 수정","프로필 · 학교 검색","프로필 · 사진 설정","설정 · 앱·계정 관리","설정 · 똑 PRO 구독","설정 · 이용약관","설정 · 데이터 초기화","꼬르륵 · 날짜별 급식","꼬르륵 · 주간 급식","꼬르륵 · 학교 설정","꼬르륵 · 급식 알림","공통 메뉴","공통 메뉴 · 선택 목록","오류 화면"];
      names.sort((a,b)=>preferred.indexOf(a)-preferred.indexOf(b));
      screens=names.map(name=>({name,items:catalog.filter(x=>x.screen===name)}));
      activeScreen=screens[0]?.name||"";
      const saved=localStorage.getItem(storageKey);
      if(saved){try{const parsed=JSON.parse(saved);if(Array.isArray(parsed)){const byId=new Map(catalog.map((x,i)=>[x.id,{...x,baseLabel:x.label,baseScreen:x.screen,baseOrder:i,hidden:false,note:""}]));const ordered=parsed.filter(x=>!x.added&&byId.has(x.id)).map(x=>({...byId.get(x.id),...x,source:byId.get(x.id).source,baseLabel:byId.get(x.id).baseLabel,baseScreen:byId.get(x.id).baseScreen,baseOrder:byId.get(x.id).baseOrder}));const included=new Set(ordered.map(x=>x.id));items=[...ordered,...[...byId.values()].filter(x=>!included.has(x.id)),...parsed.filter(x=>x.added)];}}catch{}}
      if(!items.length)items=catalog.map((x,i)=>({...x,baseLabel:x.label,baseScreen:x.screen,baseOrder:i,hidden:false,note:""}));
      $("itemScreen").innerHTML=screens.map(x=>`<option value="${escape(x.name)}">${escape(x.name)}</option>`).join("");
    }
    function draw(){
      $("screens").innerHTML=screens.map(({name})=>`<button class="${name===activeScreen?"active":""}" data-screen="${escape(name)}">${escape(name)} <span class="count">${items.filter(x=>x.screen===name&&!x.hidden).length}</span></button>`).join("");
      const active=screens.find(x=>x.name===activeScreen);
      $("screenTitle").innerHTML=`${escape(activeScreen)} <span class="badge">${active?.items.length||0}개 요소</span>`;
      $("screenDescription").textContent="이 화면에서 실제로 찾은 요소입니다. 화면 내에서 ↑ ↓로 순서를 표시하고, 숨기기 또는 편집을 선택하세요.";
      const query=$("search").value.trim().toLowerCase();
      const visible=items.filter(x=>x.screen===activeScreen&&($("showHidden").checked||!x.hidden)&&(!query||`${x.label} ${x.id} ${x.note||""}`.toLowerCase().includes(query)));
      $("items").innerHTML=visible.length?visible.map(x=>`<div class="row ${x.hidden?"hidden-item":""}" data-id="${escape(x.id)}">
        <span class="number">${escape(x.id)}</span><div class="info"><div class="label">${escape(x.label)}${x.hidden?" (숨김)":""}${x.added?" (추가 요청)":""}</div>
        <div class="meta">${escape(x.note||x.description||"앱에서 선택 가능한 실제 화면 요소")}</div>${x.source?`<div class="source">코드 위치: ${escape(x.source)}</div>`:""}</div>
        <div class="actions"><button data-cmd="edit">편집</button><button data-cmd="toggle">${x.hidden?"표시":"숨기기"}</button><button data-cmd="up" aria-label="위로">↑</button><button data-cmd="down" aria-label="아래로">↓</button></div></div>`).join(""):`<div class="empty">조건에 맞는 요소가 없습니다.</div>`;
    }
    $("screens").onclick=e=>{const b=e.target.closest("[data-screen]");if(b){activeScreen=b.dataset.screen;$ ("search").value="";$("showHidden").checked=true;draw();}};
    $("items").onclick=e=>{
      const b=e.target.closest("button[data-cmd]"), row=e.target.closest("[data-id]");if(!b||!row)return;
      const index=items.findIndex(x=>x.id===row.dataset.id),item=items[index];
      if(b.dataset.cmd==="edit")openEditor(item);
      if(b.dataset.cmd==="toggle"){item.hidden=!item.hidden;persist();draw();}
      if(["up","down"].includes(b.dataset.cmd)){
        const peers=items.filter(x=>x.screen===activeScreen),pos=peers.findIndex(x=>x.id===item.id),otherItem=peers[pos+(b.dataset.cmd==="up"?-1:1)];
        if(otherItem){const other=items.indexOf(otherItem);[items[index],items[other]]=[items[other],items[index]];persist();draw();}
      }
    };
    function openEditor(item){editingId=item.id;$("editorTitle").textContent=item.id+" 편집";$("itemLabel").value=item.label;$("itemAction").value=item.description||"";$("itemScreen").value=item.screen;$("itemNote").value=item.note||"";$("editor").hidden=false;$("editor").scrollIntoView({behavior:"smooth",block:"nearest"});}
    $("apply").onclick=()=>{const item=items.find(x=>x.id===editingId);if(!item)return;item.label=$("itemLabel").value.trim()||item.label;item.description=$("itemAction").value.trim();item.screen=$("itemScreen").value;item.note=$("itemNote").value.trim();$("editor").hidden=true;editingId=null;persist();draw();};
    $("cancel").onclick=()=>{$("editor").hidden=true;editingId=null;};
    $("add").onclick=()=>{const prefix=activeScreen.replace(/[^가-힣A-Za-z0-9]/g,"").slice(0,5)||"NEW";let n=items.filter(x=>x.id.startsWith("new-"+prefix+"-")).length+1;const item={id:`new-${prefix}-${String(n).padStart(2,"0")}`,screen:activeScreen,label:"추가할 버튼 이름",description:"원하는 동작을 적어 주세요",note:"",hidden:false,added:true,source:"설계 요청"};items.push(item);persist();draw();openEditor(item);};
    $("reset").onclick=()=>{if(!confirm(`${activeScreen} 화면의 편집안을 초기화할까요?`))return;items=items.filter(x=>!(x.added&&(x.screen===activeScreen||x.baseScreen===activeScreen)));for(const x of items.filter(x=>x.baseScreen===activeScreen)){const original=catalog.find(c=>c.id===x.id);if(original){x.label=original.label;x.description=original.label;x.screen=original.screen;x.hidden=false;x.note="";}}items.sort((a,b)=>(a.baseOrder??Number.MAX_SAFE_INTEGER)-(b.baseOrder??Number.MAX_SAFE_INTEGER));persist();$("editor").hidden=true;draw();};
    $("search").oninput=draw;$("showHidden").onchange=draw;
    $("save").onclick=()=>{const changes=items.filter((x,i)=>x.added||x.hidden||x.note||x.label!==x.baseLabel||x.screen!==x.baseScreen||x.description!==catalog.find(c=>c.id===x.id)?.label||i!==x.baseOrder);const payload={title:"똑 화면별 UI 변경안",createdAt:new Date().toISOString(),screenCount:screens.length,changes,allItems:items};const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download="ttok-ui-changes.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
    fetch("/ui-catalog.json").then(r=>{if(!r.ok)throw Error("목록 파일을 불러오지 못했습니다.");return r.json();}).then(data=>{catalog=data;setupScreens();draw();}).catch(()=>{$("screenTitle").textContent="화면 목록을 불러오지 못했습니다";$("screenDescription").textContent="프로젝트 루트에서 npm run ui:map을 실행한 뒤 이 페이지를 새로고침하세요.";});
  </script>
</body>
</html>
