<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>똑 실제 화면 UI 편집기</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#17243a;background:#f1f5fa}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px}
    .top{max-width:1440px;margin:0 auto 14px}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    h1{font-size:24px;margin:0}.note{font-size:14px;line-height:1.55;color:#5c6d83;margin:7px 0 12px}
    .actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}button{font:inherit;cursor:pointer;border:1px solid #cad6e4;background:white;color:#183252;border-radius:10px;padding:8px 11px}
    button:hover{border-color:#1769dc;color:#075bc5}.actions .primary{background:#1267db;border-color:#1267db;color:white;font-weight:750}
    .layout{max-width:1440px;margin:auto;display:grid;grid-template-columns:210px minmax(0,1fr);gap:14px;align-items:stretch}
    .card{border:1px solid #dce5ef;border-radius:16px;background:white;box-shadow:0 8px 30px #1834500c}
    .tabs{padding:12px;display:flex;flex-direction:column;gap:5px;align-self:start;position:sticky;top:12px}
    .tabs h2{font-size:14px;color:#6b7b90;margin:3px 7px 7px}.tabs button{text-align:left;border:0;background:transparent;padding:10px 11px;font-weight:700;color:#41536c}
    .tabs button:hover,.tabs button.active{background:#eaf2ff;color:#075fcf}
    .stage{min-height:calc(100vh - 138px);display:flex;justify-content:center;align-items:flex-start;gap:20px;padding:18px;background:radial-gradient(ellipse at 50% 20%,#e4edf9,#f4f7fb 70%);overflow:auto}
    .phone-column{width:411px;flex:0 0 411px}.phone-label{display:flex;align-items:center;justify-content:space-between;margin:0 4px 10px;font-size:15px;font-weight:800}.phone-label small{font-size:12px;font-weight:600;color:#61728a}.phone-label .pro{color:#b36b09}
    /* 실제 앱 DOM을 모바일 웹뷰와 비슷한 393 x 852 CSS px 뷰포트로 렌더링 */
    .device{width:411px;height:min(870px,calc(100vh - 205px));min-height:650px;border:9px solid #171c25;border-radius:42px;background:#171c25;box-shadow:0 20px 60px #142a4440;overflow:hidden;position:relative}
    iframe{width:100%;height:100%;border:0;display:block;background:#fff}
    .state{position:absolute;inset:9px;background:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px;color:#64748b;pointer-events:none}
    .state[hidden]{display:none}.status{font-size:12px;color:#728097;margin-top:9px}
    @media(max-width:1150px){.stage{justify-content:flex-start}}
    @media(max-width:760px){body{padding:10px}.layout{display:flex;flex-direction:column}.tabs{position:static;flex-direction:row;overflow:auto;white-space:nowrap;padding:7px}.tabs h2{display:none}.tabs button{flex:none}.stage{min-height:0;padding:10px}.phone-column{width:360px;flex-basis:360px}.device{height:calc(100dvh - 220px);min-height:540px;width:360px;border-width:6px;border-radius:32px}.state{inset:6px}}
  </style>
</head>
<body>
  <header class="top">
    <div class="topline"><h1>똑 실제 화면 편집</h1><div class="actions"><button id="reload">앱 새로고침</button><button class="primary" id="selection">앱에서 UI 선택 켜기</button></div></div>
    <p class="note">왼쪽은 무료, 오른쪽은 PRO로 표시한 똑 앱 화면입니다. 요금제 표시는 UI 비교용이며 로그인 계정이나 실제 결제 상태를 바꾸지 않습니다. 좁은 화면에서는 옆으로 밀어 두 폰을 볼 수 있습니다.</p>
    <div class="status" id="status">두 앱 화면을 불러오는 중… 로그인이 필요하면 한 화면에서 로그인한 뒤 앱 새로고침을 눌러 주세요.</div>
  </header>
  <div class="layout">
    <nav class="tabs card" aria-label="앱 화면 바로가기">
      <h2>실제 앱 화면 바로가기</h2>
      <button data-tab="nav-home">홈</button>
      <button data-tab="nav-assessment">수행평가</button>
      <button data-tab="nav-practice">발표연습</button>
      <button data-tab="nav-study">공부</button>
      <button data-tab="nav-profile">프로필</button>
      <button data-tab="nav-settings">설정·구독</button>
      <button data-tab="nav-meal-today">꼬르륵 급식</button>
    </nav>
    <main class="stage card" aria-label="무료 및 PRO 앱 화면 비교">
      <div class="phone-column">
        <div class="phone-label"><span>무료 플랜</span><small>월 30회</small></div>
        <div class="device">
          <iframe id="app-free" title="똑 무료 플랜 앱 화면" src="/?ui=1&amp;planPreview=free" allow="camera; microphone; clipboard-read; clipboard-write"></iframe>
          <div class="state" id="loading-free">무료 앱 화면을 불러오는 중…</div>
        </div>
      </div>
      <div class="phone-column">
        <div class="phone-label"><span class="pro">똑 PRO</span><small>월 100회 · AI 추천</small></div>
        <div class="device">
          <iframe id="app-pro" title="똑 PRO 플랜 앱 화면" src="/?ui=1&amp;planPreview=pro" allow="camera; microphone; clipboard-read; clipboard-write"></iframe>
          <div class="state" id="loading-pro">PRO 앱 화면을 불러오는 중…</div>
        </div>
      </div>
    </main>
  </div>
  <script>
    const frames=[document.getElementById("app-free"),document.getElementById("app-pro")],status=document.getElementById("status");
    frames.forEach((frame,index)=>frame.addEventListener("load",()=>{document.getElementById(index===0?"loading-free":"loading-pro").hidden=true;status.textContent="두 폰에서 앱의 같은 메뉴를 비교할 수 있습니다. 왼쪽은 무료, 오른쪽은 PRO 미리보기입니다.";}));
    document.getElementById("reload").onclick=()=>{frames.forEach((frame,index)=>{document.getElementById(index===0?"loading-free":"loading-pro").hidden=false;frame.contentWindow.location.reload();});status.textContent="두 앱 화면을 새로 불러오는 중…";};
    document.getElementById("selection").onclick=()=>{let selected=0;frames.forEach(frame=>{try{const toggle=frame.contentDocument.getElementById("ui-design-toggle");if(toggle){toggle.click();selected++;}}catch{}});if(!selected)status.textContent="앱을 불러오는 중입니다. 잠시 후 다시 눌러 주세요.";};
    document.querySelector(".tabs").addEventListener("click",event=>{const button=event.target.closest("[data-tab]");if(!button)return;let moved=0;frames.forEach(frame=>{try{const target=frame.contentDocument.querySelector(`[data-ui="${button.dataset.tab}"]`);if(target){target.click();moved++;}}catch{}});if(moved){document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("active",x===button));}else status.textContent="이동할 앱 탭이 아직 표시되지 않습니다. 로그인 후 다시 선택해 주세요.";});
  </script>
</body>
</html>
