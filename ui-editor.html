<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>똑 화면 구성 편집표</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#152238;background:#f4f7fb}
    *{box-sizing:border-box}body{margin:0;padding:24px;max-width:1180px;margin-inline:auto}
    h1{margin:0 0 8px;font-size:28px}p{line-height:1.55}.muted{color:#607087}
    .toolbar,.layout,.row,.actions{display:flex;gap:12px}.toolbar{flex-wrap:wrap;margin:24px 0}
    button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #cbd8e8;background:white;border-radius:11px;padding:9px 12px;color:#17345b}
    button:hover{border-color:#1970e9}button.primary{background:#1267db;color:white;border-color:#1267db}
    .layout{align-items:flex-start}.screens{width:230px;flex:none}.panel{flex:1;min-width:0}
    .card{background:white;border:1px solid #dce5ef;border-radius:18px;padding:18px;box-shadow:0 4px 20px #17345b0b}
    .screens button{display:block;width:100%;text-align:left;margin:4px 0;border:0}.screens button.active{background:#e9f2ff;color:#0863cf;font-weight:700}
    .row{align-items:center;border-top:1px solid #edf1f6;padding:12px 0;flex-wrap:wrap}.row:first-child{border:0}
    .number{font-weight:800;color:#1267db;min-width:66px}.info{flex:1;min-width:180px}
    .label{font-weight:700}.meta{font-size:13px;color:#65758a;margin-top:3px;word-break:break-all}
    .actions{flex-wrap:wrap}.actions button{padding:7px 9px}
    .hidden-item{opacity:.45}.editor{margin-top:22px;padding:16px;border-radius:14px;background:#f3f7fc}
    .editor label{display:block;font-weight:700;margin:10px 0 5px}
    .editor input,.editor textarea,.editor select{width:100%;border:1px solid #cbd8e8;border-radius:9px;padding:10px;background:white}
    .editor textarea{min-height:70px;resize:vertical}.editor .buttons{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
    .tip{background:#e8f2ff;border:1px solid #c9e0ff;padding:12px 15px;border-radius:12px}
    @media(max-width:720px){body{padding:12px}.layout{display:block}.screens{width:100%;display:flex;overflow:auto;gap:4px;margin-bottom:14px}.screens button{white-space:nowrap;width:auto}.actions{width:100%}}
  </style>
</head>
<body>
  <h1>똑 화면 구성 편집표</h1>
  <p class="muted">실제 앱 코드를 기준으로 화면과 조작 항목을 나눴습니다. 항목을 선택해 이름·위치·메모를 수정하거나 숨길 수 있습니다. 여기서의 변경은 설계안이며, 앱에는 자동 반영되지 않습니다.</p>
  <p class="tip">편집 후 <b>변경안 JSON 저장</b>을 누르고 그 파일을 전달해 주세요. 번호만 말해도 됩니다. 예: “ST-04 삭제, HM-03을 맨 위로, PR-02 이름 변경”.</p>
  <div class="toolbar">
    <button class="primary" id="save">변경안 JSON 저장</button>
    <button id="add">현재 화면에 항목 추가</button>
    <button id="reset">편집표 초기화</button>
  </div>
  <div class="layout">
    <nav class="screens card" id="screens" aria-label="화면 목록"></nav>
    <main class="panel card">
      <h2 id="screenTitle"></h2>
      <p class="muted" id="screenDescription"></p>
      <div id="items"></div>
      <section class="editor" id="editor" hidden>
        <h3 id="editorTitle">항목 편집</h3>
        <label for="itemLabel">표시 이름</label><input id="itemLabel">
        <label for="itemAction">누르면 실행되는 기능</label><textarea id="itemAction"></textarea>
        <label for="itemScreen">배치할 화면</label><select id="itemScreen"></select>
        <label for="itemNote">추가·삭제·위치 변경 등 요청 메모</label><textarea id="itemNote"></textarea>
        <div class="buttons"><button class="primary" id="apply">반영</button><button id="cancel">취소</button></div>
      </section>
    </main>
  </div>
  <script>
    const definitions = [
      ["LG","로그인·첫 사용","로그인 후 이용약관 동의 및 이메일 인증 흐름.",[
        ["Google 로그인","Google 계정 선택과 Firebase 로그인"],["이메일·비밀번호","새 계정 생성 또는 기존 계정 로그인"],
        ["비밀번호 재설정","이메일로 재설정 메일 발송"],["이용약관 동의","첫 사용자의 필수 동의"],["이메일 인증","비밀번호 계정의 메일 인증 확인"]]],
      ["GL","공통 영역","앱 상단, 뒤로가기와 하단 탭.",[
        ["똑 / 꼬르륵 전환","두 서비스 전환"],["학교·학년·프로필 사진","현재 프로필 표시"],
        ["뒤로가기","이전 화면 또는 팝업으로 이동"],["하단 홈","홈 탭 열기"],["하단 수행평가","수행평가 탭 열기"],
        ["하단 발표연습","발표 대본·연습 탭 열기"],["하단 공부","공부 탭 열기"],
        ["하단 프로필","프로필 탭 열기"],["하단 설정","설정 탭 열기"]]],
      ["HM","홈","첫 화면의 정보 카드와 자주 쓰는 동작.",[
        ["학기 목표","프로필에 저장한 목표 표시"],["AI 리포트 (PRO)","일일 추천 보기·새로고침"],
        ["자주 쓰는 기능","연결된 기능 바로가기"],["단축키 수정","바로가기 연결 편집"],
        ["수행평가·시험 카운트다운","예정된 일정 D-Day 표시"],["스케줄 추가","일정 등록 폼 열기"],
        ["스케줄 수정","저장된 일정 수정"],["스케줄 삭제","저장된 일정 삭제"],
        ["오늘 할 일","할 일 완료 상태 전환·추가·삭제"]]],
      ["AS","수행평가","일정 목록, 직접 입력 및 사진 스캔.",[
        ["수행평가 목록","등록된 일정 보기"],["직접 입력","수행평가 일정 작성"],
        ["사진 스캔 등록","사진에서 일정 정보 추출"],["스캔 결과 저장","추출 결과를 일정으로 저장"],
        ["일정 수정","등록된 평가 수정"],["일정 삭제","등록된 평가 삭제"]]],
      ["PR","발표연습","대본 작성, 저장, 발표 촬영과 결과.",[
        ["발표 대본 작성 탭","AI 대본 작성 화면"],["발표 연습 도와주기 탭","촬영·분석 화면"],
        ["대본 생성","입력한 조건으로 대본 생성"],["저장된 대본 열기","전체 화면 대본 팝업"],
        ["대본 복사","클립보드에 복사"],["PDF 저장","대본 PDF 변환"],["대본 공유","기기 공유 메뉴"],
        ["글자 크기","작게·중간·크게"],["대본 삭제","저장된 대본 삭제"],
        ["카메라 권한","카메라 접근 허용"],["발표 연습 시작","촬영·음성 입력 시작"],
        ["발표 종료·분석","촬영 중지 및 분석 요청"],["분석 다시 시도","실패한 분석 재요청"],
        ["분석 결과","점수와 피드백 보기"],["연습용 대본 선택","저장 대본 또는 직접 입력"]]],
      ["ST","공부","사진 문제 풀이, AI 공부 기능, 시험 계획.",[
        ["사진 문제 촬영","카메라로 문제 찍기"],["사진 문제 갤러리","기존 사진 선택"],
        ["사진 문제 풀이","로컬 계산 또는 Gemini 풀이"],["요약","학습 자료 요약"],
        ["퀴즈","학습 자료로 퀴즈 만들기"],["노트","학습 노트 만들기"],
        ["질문","학습 질문 답변"],["공부 자료 사진 선택","갤러리·파일에서 자료 선택"],
        ["공부 자료 촬영","카메라로 학습 자료 찍기"],["공부 기능 실행","선택한 기능으로 AI 요청"],
        ["지필평가 일정 추가","시험 일정 등록"],["지필평가 일정 수정","시험 일정 수정"],
        ["지필평가 일정 삭제","시험 일정 삭제"],["AI 공부 계획","시험 일정 기반 공부 계획 생성"]]],
      ["PF","프로필","학생 정보·학교·목표·사진 편집.",[
        ["프로필 사진","사진 선택 또는 카메라 촬영"],["학교 검색","나이스 학교 목록 검색·선택"],
        ["학년·반","학교 종류에 맞게 학년·반 선택"],["학기 목표","직접 작성·랜덤 선택·삭제"],
        ["프로필 저장","변경한 학생 정보 저장"]]],
      ["SE","설정·구독","테마, 알림, 계정, 똑 PRO.",[
        ["다크 모드","밝은·어두운 테마 전환"],["알림 설정 저장","일정·급식 알림 설정"],
        ["기간 지난 일정 자동 삭제","지난 일정·할 일 삭제 기능 전환"],
        ["똑 PRO 구독하기","구독 상품 화면 열기"],["구독 관리·해지","Play 스토어 구독 관리 열기"],
        ["구매 내역 복원","RevenueCat 구매 상태 확인"],["이용약관","약관 팝업 열기"],
        ["로그아웃","현재 계정 로그아웃"],["데이터 영구 삭제","프로필·일정·대본·기록 삭제"]]],
      ["PW","똑 PRO 결제 팝업","무료·유료 비교와 구독 구매.",[
        ["무료·PRO 비교","월 AI 사용량과 AI 추천 여부 비교"],["월간 선택","월간 구독 선택"],
        ["연간 선택","연간 구독 선택"],["결제하기","선택 상품 구매 요청"],
        ["닫기·뒤로가기","결제 팝업 닫기"]]],
      ["KK","꼬르륵 급식","오늘·주간 급식과 학교 설정.",[
        ["오늘 급식","선택 날짜 급식 보기"],["날짜 이동","이전·다음 달 및 날짜 선택"],
        ["이번 주 급식","주간 메뉴 보기"],["주 이동","이전 주·이번 주·다음 주"],
        ["학교 설정","학교 검색 및 선택"],["급식 알림","급식 알림 시간·켜기·끄기"]]]
    ];
    const initial = definitions.flatMap(([prefix,screen,description,rows]) => rows.map(([label,action],i) =>
      ({id:prefix+"-"+String(i+1).padStart(2,"0"),screen,label,action,note:"",hidden:false})));
    const storageKey="ttok-ui-review-v1";
    let items;
    try { items=JSON.parse(localStorage.getItem(storageKey)) || structuredClone(initial); }
    catch { items=structuredClone(initial); }
    let screen=definitions[0][1], editing=null;
    const $=id=>document.getElementById(id);
    const escape=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    function persist(){try{localStorage.setItem(storageKey,JSON.stringify(items));}catch{}}
    function draw(){
      $("screens").innerHTML=definitions.map(([,name])=>`<button class="${name===screen?"active":""}" data-screen="${escape(name)}">${escape(name)} <small>(${items.filter(x=>x.screen===name&&!x.hidden).length})</small></button>`).join("");
      $("screenTitle").textContent=screen;
      $("screenDescription").textContent=definitions.find(x=>x[1]===screen)?.[2] || "";
      $("items").innerHTML=items.filter(x=>x.screen===screen).map(x=>`<div class="row ${x.hidden?"hidden-item":""}" data-id="${escape(x.id)}">
        <span class="number">${escape(x.id)}</span><div class="info"><div class="label">${escape(x.label)} ${x.hidden?"(숨김)":""}</div>
        <div class="meta">${escape(x.action)}</div>${x.note?`<div class="meta">메모: ${escape(x.note)}</div>`:""}</div>
        <div class="actions"><button data-cmd="edit">편집</button><button data-cmd="toggle">${x.hidden?"다시 표시":"숨기기"}</button>
        <button data-cmd="up" aria-label="위로 이동">↑</button><button data-cmd="down" aria-label="아래로 이동">↓</button></div></div>`).join("");
      $("itemScreen").innerHTML=definitions.map(([,name])=>`<option value="${escape(name)}">${escape(name)}</option>`).join("");
    }
    $("screens").onclick=e=>{const target=e.target.closest("[data-screen]");if(target){screen=target.dataset.screen;draw();}};
    $("items").onclick=e=>{
      const button=e.target.closest("button[data-cmd]"), row=e.target.closest("[data-id]");
      if(!button||!row)return;
      const index=items.findIndex(x=>x.id===row.dataset.id), item=items[index];
      if(button.dataset.cmd==="edit")openEditor(item);
      if(button.dataset.cmd==="toggle"){item.hidden=!item.hidden;persist();draw();}
      if(["up","down"].includes(button.dataset.cmd)){
        const visible=items.filter(x=>x.screen===screen), position=visible.findIndex(x=>x.id===item.id);
        const sibling=visible[position+(button.dataset.cmd==="up"?-1:1)];
        if(sibling){const other=items.indexOf(sibling);[items[index],items[other]]=[items[other],items[index]];persist();draw();}
      }
    };
    function openEditor(item){
      editing=item;
      $("editorTitle").textContent=item.id+" 편집";
      $("itemLabel").value=item.label;$("itemAction").value=item.action;
      $("itemScreen").value=item.screen;$("itemNote").value=item.note;
      $("editor").hidden=false;$("editor").scrollIntoView({behavior:"smooth",block:"nearest"});
    }
    $("apply").onclick=()=>{if(!editing)return;editing.label=$("itemLabel").value.trim()||editing.label;
      editing.action=$("itemAction").value.trim();editing.screen=$("itemScreen").value;
      editing.note=$("itemNote").value.trim();$("editor").hidden=true;persist();draw();};
    $("cancel").onclick=()=>{$("editor").hidden=true;editing=null;};
    $("add").onclick=()=>{const prefix=definitions.find(x=>x[1]===screen)[0];let n=items.filter(x=>x.id.startsWith(prefix+"-")).length+1;
      while(items.some(x=>x.id===prefix+"-"+String(n).padStart(2,"0")))n++;
      const item={id:prefix+"-"+String(n).padStart(2,"0"),screen,label:"새 버튼/기능",action:"",note:"",hidden:false,added:true};
      items.push(item);persist();draw();openEditor(item);};
    $("reset").onclick=()=>{if(!confirm("편집한 설계안을 모두 초기화할까요?"))return;items=structuredClone(initial);persist();$("editor").hidden=true;draw();};
    $("save").onclick=()=>{
      const changed=items.filter(x=>x.added||x.hidden||x.note||!initial.some(y=>y.id===x.id&&y.screen===x.screen&&y.label===x.label&&y.action===x.action)||
        items.indexOf(x)!==initial.findIndex(y=>y.id===x.id));
      const payload={title:"똑 UI 변경안",createdAt:new Date().toISOString(),changes:changed,allItems:items};
      const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}));
      const link=document.createElement("a");link.href=url;link.download="ttok-ui-changes.json";link.click();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
    };
    draw();
  </script>
</body>
</html>
