name: Build Android AAB (Signed Release)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Inject google-services.json (for Google Sign-In)
        if: ${{ vars.GOOGLE_SERVICES_JSON != '' }}
        run: echo '${{ vars.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Build Web Application
        run: npm run build
        env:
          APP_URL: ${{ vars.APP_URL }}
          REVENUECAT_API_KEY_ANDROID: ${{ vars.REVENUECAT_API_KEY_ANDROID }}
          APP_SHARED_SECRET: ${{ secrets.APP_SHARED_SECRET }}

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/release.keystore

      - name: Write keystore.properties
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Make Gradlew Executable
        run: chmod +x gradlew
        working-directory: android

      - name: Build Signed Release AAB
        run: ./gradlew bundleRelease
        working-directory: android

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ttok-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
