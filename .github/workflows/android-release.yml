name: Build Android AAB (Signed Release)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build
        env:
          APP_URL: ${{ vars.APP_URL }}
          REVENUECAT_API_KEY_ANDROID: ${{ vars.REVENUECAT_API_KEY_ANDROID }}
          REVENUECAT_API_KEY_IOS: ${{ vars.REVENUECAT_API_KEY_IOS }}
          APP_SHARED_SECRET: ${{ secrets.APP_SHARED_SECRET }}

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes the legacy 'tools' package,
          # which the current sdkmanager no longer provides and fails on.
          packages: platform-tools

      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/release.keystore

      - name: Write keystore.properties
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Make Gradlew Executable
        run: chmod +x gradlew
        working-directory: android

      - name: Build Signed Release AAB
        run: ./gradlew bundleRelease assembleRelease
        working-directory: android

      - name: Verify Play upload signing certificate
        shell: bash
        run: |
          bundle=android/app/build/outputs/bundle/release/app-release.aab
          actual_sha1=$(keytool -printcert -jarfile "$bundle" | sed -n 's/^[[:space:]]*SHA1: //p' | head -n 1)
          expected_sha1='E8:EF:D6:BA:A0:3D:A3:38:B1:CD:1C:A7:20:A9:AA:E6:F0:28:54:F6'
          echo "AAB signing SHA-1: $actual_sha1"
          if [[ "$actual_sha1" != "$expected_sha1" ]]; then
            echo 'AAB signing key does not match the Google Play upload certificate.' >&2
            exit 1
          fi

      - name: Verify APK signing certificate
        shell: bash
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          cert_output=$("$signer" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk)
          echo "$cert_output"
          actual_sha1=$(printf '%s\n' "$cert_output" | sed -n 's/^Signer.*certificate SHA-1 digest: //p' | head -n 1 | tr -d '\r:' | tr '[:upper:]' '[:lower:]')
          expected_sha1='e8efd6baa03da338b1cd1ca720a9aae6f02854f6'
          echo "APK signing SHA-1: $actual_sha1"
          [[ "$actual_sha1" == "$expected_sha1" ]]

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ttok-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ttok-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
