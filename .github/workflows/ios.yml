name: Build iOS App (Unsigned IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npx vite build
        env:
          APP_URL: ${{ vars.APP_URL }}
          APP_SHARED_SECRET: ${{ vars.APP_SHARED_SECRET }}

      - name: Add iOS platform (if missing)
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Configure camera/microphone permission descriptions
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :NSCameraUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string '발표 연습을 녹화하기 위해 카메라 접근 권한이 필요합니다.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSMicrophoneUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string '발표 연습 음성을 녹음하기 위해 마이크 접근 권한이 필요합니다.'" "$PLIST"

      - name: Prevent Facebook SDK crash-on-launch (transitive dep of the auth plugin)
        run: |
          PLIST=ios/App/App/Info.plist
          # @capacitor-firebase/authentication pulls in FBSDKCoreKit/FBSDKLoginKit as a
          # dependency even though we never enable "facebook.com" as a provider. FBSDKCoreKit
          # validates its own config (FacebookAppID etc.) at app launch and raises a fatal
          # NSException if missing. FacebookAutoInitEnabled=false skips that auto-init/validation
          # entirely; the placeholder keys are defense-in-depth in case anything still reads them.
          /usr/libexec/PlistBuddy -c "Delete :FacebookAutoInitEnabled" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :FacebookAutoInitEnabled bool false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :FacebookAutoLogAppEventsEnabled" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :FacebookAutoLogAppEventsEnabled bool false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :FacebookAdvertiserIDCollectionEnabled" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :FacebookAdvertiserIDCollectionEnabled bool false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :FacebookAppID" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :FacebookAppID string 000000000000000" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :FacebookClientToken" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :FacebookClientToken string 0000000000000000000000000000000" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :FacebookDisplayName" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :FacebookDisplayName string 똑" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string fb000000000000000" "$PLIST"

      - name: Inject GoogleService-Info.plist and URL scheme (for Google Sign-In)
        if: ${{ vars.GOOGLE_SERVICE_INFO_PLIST != '' }}
        run: |
          PLIST=ios/App/App/Info.plist
          GOOGLE_PLIST=ios/App/App/GoogleService-Info.plist
          cat > "$GOOGLE_PLIST" <<'EOF'
          ${{ vars.GOOGLE_SERVICE_INFO_PLIST }}
          EOF
          REVERSED_CLIENT_ID=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" "$GOOGLE_PLIST")
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1:CFBundleURLSchemes:0 string $REVERSED_CLIENT_ID" "$PLIST"

      - name: Resolve Swift Package dependencies
        working-directory: ios/App
        run: xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

      - name: Build unsigned archive
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            archive

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r ttok-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ttok-ios-unsigned-ipa
          path: build/ttok-unsigned.ipa
