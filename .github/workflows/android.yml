name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Inject google-services.json (for Google Sign-In)
        if: ${{ vars.GOOGLE_SERVICES_JSON != '' }}
        run: echo '${{ vars.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Build Web Application
        run: npm run build
        env:
          APP_URL: ${{ vars.APP_URL }}
          REVENUECAT_API_KEY_ANDROID: ${{ vars.REVENUECAT_API_KEY_ANDROID }}
          APP_SHARED_SECRET: ${{ secrets.APP_SHARED_SECRET }}

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew
        working-directory: android

      - name: Build Android APK (Debug)
        run: ./gradlew assembleDebug
        working-directory: android

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ttok-schoolmate-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
